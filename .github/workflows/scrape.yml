name: Scrape Biwenger feed

on:
  schedule:
    - cron: '10 6 * * *'   # 6:10 UTC = 7:10 hora española (invierno) / 8:10 (verano)
  workflow_dispatch:         # ejecución manual desde la UI de GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # necesario para hacer commit del transactions.json actualizado

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scraper.js
        env:
          BIWENGER_EMAIL: ${{ secrets.BIWENGER_EMAIL }}
          BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transactions.json
          git diff --staged --quiet || git commit -m "data: update transactions $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
