<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIGA 26/27 — Dashboard Financiero</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #242736;
    --border: #2e3247;
    --text: #e2e4ef;
    --muted: #7b7f9a;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #3b82f6;
    --accent: #6366f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.5; }

  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--text); }
  header .meta { font-size: 12px; color: var(--muted); }

  .warning { background: #2d1f05; border: 1px solid #78350f; color: var(--yellow); padding: 10px 24px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .warning span { font-size: 16px; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 12px; }

  /* Rankings table */
  .rankings { width: 100%; border-collapse: collapse; margin-bottom: 32px; }
  .rankings th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--border); }
  .rankings td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .rankings tr:last-child td { border-bottom: none; }
  .rankings tr:hover td { background: var(--bg3); cursor: pointer; }

  .rank-num { font-weight: 700; color: var(--muted); width: 28px; }
  .participant-name { font-weight: 600; }
  .balance-cell { font-weight: 700; font-size: 15px; }
  .balance-pos { color: var(--green); }
  .balance-neg { color: var(--red); }
  .balance-na { color: var(--muted); font-size: 13px; }
  .ops-count { color: var(--muted); font-size: 12px; }
  .incomplete-badge { background: #2d1f05; color: var(--yellow); font-size: 10px; padding: 2px 6px; border-radius: 4px; }

  .bar-container { width: 100px; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }
  .bar-pos { background: var(--green); }
  .bar-neg { background: var(--red); }

  /* Detail panels */
  .detail-grid { display: grid; gap: 16px; }

  .participant-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .card-header:hover { background: var(--bg3); }
  .card-header .name { font-weight: 600; font-size: 15px; }
  .card-header .summary { display: flex; gap: 20px; align-items: center; }
  .card-header .chevron { color: var(--muted); transition: transform .2s; font-size: 12px; }
  .card-header.open .chevron { transform: rotate(180deg); }

  .stat-pill { display: flex; flex-direction: column; align-items: flex-end; }
  .stat-pill .label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .stat-pill .value { font-size: 14px; font-weight: 700; }

  .card-body { display: none; border-top: 1px solid var(--border); }
  .card-body.open { display: block; }

  .tx-table { width: 100%; border-collapse: collapse; }
  .tx-table th { text-align: left; padding: 8px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); background: var(--bg3); }
  .tx-table td { padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .tx-table tr:last-child td { border-bottom: none; }

  .tx-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tx-Compra    { background: #1e2a3a; color: #60a5fa; }
  .tx-Venta     { background: #14271e; color: #4ade80; }
  .tx-Clausula  { background: #2d1f05; color: #fbbf24; }
  .tx-Prima            { background: #1a1f35; color: #a78bfa; }
  .tx-Salario          { background: #2a1515; color: #f87171; }
  .tx-DepositoClausula { background: #1a2a1a; color: #86efac; }

  .amount-pos { color: var(--green); font-weight: 600; }
  .amount-neg { color: var(--red); font-weight: 600; }

  .totals-row td { background: var(--bg3); font-weight: 600; }

  footer { text-align: center; padding: 24px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 32px; }

  @media (max-width: 640px) {
    .bar-container { display: none; }
    .card-header .summary { gap: 10px; }
    .tx-table th:nth-child(3), .tx-table td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>⚽ LIGA 26/27 — Dashboard Financiero</h1>
  <div class="meta" id="meta-info">Cargando…</div>
</header>

<div class="warning" id="warning-banner" style="display:none">
  <span>⚠️</span>
  <span id="warning-text"></span>
</div>

<main>
  <h2>Clasificación Financiera</h2>
  <table class="rankings" id="rankings-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Participante</th>
        <th>Saldo calculado</th>
        <th>Balance</th>
        <th>Ingresos</th>
        <th>Gastos</th>
        <th>Ops</th>
      </tr>
    </thead>
    <tbody id="rankings-body"></tbody>
  </table>

  <h2>Detalle por participante</h2>
  <div class="detail-grid" id="detail-grid"></div>
</main>

<footer id="footer">Dashboard generado a partir de datos del feed de Biwenger.</footer>

<script>
const INITIAL_BALANCE = 40_000_000;

function fmt(n) {
  return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
}

function calcStats(transactions, participant) {
  let income = 0, expense = 0;
  const txs = transactions.filter(t => t.participant === participant);
  for (const t of txs) {
    if (t.balance_effect === '+') income += t.amount;
    else expense += t.amount;
  }
  return { income, expense, balance: INITIAL_BALANCE + income - expense, txs };
}

async function load() {
  let data;
  try {
    const res = await fetch('./transactions.json');
    data = await res.json();
  } catch (e) {
    document.getElementById('meta-info').textContent = 'Error cargando transactions.json';
    return;
  }

  const { metadata, transactions } = data;

  // Meta info
  const lastFetched = metadata.last_fetched || '?';
  const lastUpdated = metadata.last_updated ? new Date(metadata.last_updated).toLocaleString('es-ES') : '?';
  document.getElementById('meta-info').textContent =
    `Última actualización: ${lastUpdated} · Datos hasta: ${lastFetched} · ${transactions.length} operaciones`;

  // Warning if data is incomplete
  const missingNote = (metadata.notes || []).find(n => n.includes('AVISO'));
  if (missingNote) {
    document.getElementById('warning-banner').style.display = 'flex';
    document.getElementById('warning-text').textContent =
      'Datos incompletos: ' + missingNote.replace('AVISO: ', '') + ' Los saldos mostrados son parciales.';
  }

  // Compute stats per participant
  const stats = metadata.participants.map(p => ({ participant: p, ...calcStats(transactions, p) }));
  stats.sort((a, b) => b.balance - a.balance);

  const maxAbsBalance = Math.max(...stats.map(s => Math.abs(s.balance - INITIAL_BALANCE)));

  // Rankings table
  const tbody = document.getElementById('rankings-body');
  stats.forEach((s, i) => {
    const isPos = s.balance >= INITIAL_BALANCE;
    const delta = s.balance - INITIAL_BALANCE;
    const pct = maxAbsBalance > 0 ? Math.abs(delta) / maxAbsBalance * 100 : 0;

    const hasData = s.txs.length > 0;
    const row = document.createElement('tr');
    row.innerHTML = `
      <td class="rank-num">${i + 1}</td>
      <td class="participant-name">
        ${s.participant}
        ${!hasData ? '<span class="incomplete-badge">sin datos</span>' : ''}
      </td>
      <td class="balance-cell ${hasData ? (isPos ? 'balance-pos' : 'balance-neg') : 'balance-na'}">
        ${hasData ? fmt(s.balance) : '—'}
      </td>
      <td>
        <div class="bar-container">
          <div class="bar-fill ${isPos ? 'bar-pos' : 'bar-neg'}" style="width:${pct}%"></div>
        </div>
      </td>
      <td class="amount-pos">${fmt(s.income)}</td>
      <td class="amount-neg">${fmt(s.expense)}</td>
      <td class="ops-count">${s.txs.length}</td>
    `;
    row.style.cursor = 'pointer';
    row.addEventListener('click', () => toggleCard(s.participant));
    tbody.appendChild(row);
  });

  // Detail cards
  const grid = document.getElementById('detail-grid');
  stats.forEach(s => {
    const card = document.createElement('div');
    card.className = 'participant-card';
    card.id = `card-${s.participant.replace(/\s+/g,'_')}`;

    const isPos = s.balance >= INITIAL_BALANCE;
    const txsSorted = [...s.txs].sort((a, b) => b.date.localeCompare(a.date));

    let txRows = '';
    let totalIncome = 0, totalExpense = 0;
    for (const t of txsSorted) {
      const sign = t.balance_effect === '+' ? '+' : '−';
      const amtClass = t.balance_effect === '+' ? 'amount-pos' : 'amount-neg';
      if (t.balance_effect === '+') totalIncome += t.amount;
      else totalExpense += t.amount;
      txRows += `<tr>
        <td>${t.date}</td>
        <td><span class="tx-type tx-${t.type}">${t.type}</span></td>
        <td>${t.player || '—'}</td>
        <td class="${amtClass}">${sign}${fmt(t.amount)}</td>
      </tr>`;
    }
    txRows += `<tr class="totals-row">
      <td colspan="3">Neto (estas ops)</td>
      <td class="${totalIncome >= totalExpense ? 'amount-pos' : 'amount-neg'}">${fmt(totalIncome - totalExpense)}</td>
    </tr>`;

    card.innerHTML = `
      <div class="card-header" onclick="toggleCard('${s.participant}')">
        <span class="name">${s.participant}</span>
        <div class="summary">
          <div class="stat-pill">
            <span class="label">Saldo calculado</span>
            <span class="value ${isPos ? 'balance-pos' : 'balance-neg'}">${s.txs.length > 0 ? fmt(s.balance) : '—'}</span>
          </div>
          <div class="stat-pill">
            <span class="label">Operaciones</span>
            <span class="value">${s.txs.length}</span>
          </div>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="card-body">
        ${s.txs.length === 0
          ? '<p style="padding:16px;color:var(--muted)">Sin transacciones registradas en el período actual.</p>'
          : `<table class="tx-table">
              <thead><tr><th>Fecha</th><th>Tipo</th><th>Jugador</th><th>Importe</th></tr></thead>
              <tbody>${txRows}</tbody>
            </table>`
        }
      </div>
    `;
    grid.appendChild(card);
  });

  // Footer
  document.getElementById('footer').textContent =
    `Saldo inicial por participante: ${fmt(INITIAL_BALANCE)} · Datos del feed de Biwenger · Actualizado: ${lastUpdated}`;
}

function toggleCard(participant) {
  const id = `card-${participant.replace(/\s+/g,'_')}`;
  const card = document.getElementById(id);
  if (!card) return;
  const header = card.querySelector('.card-header');
  const body = card.querySelector('.card-body');
  header.classList.toggle('open');
  body.classList.toggle('open');
}

load();
</script>
</body>
</html>
